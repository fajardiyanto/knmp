services:
  minio:
    image: minio/minio:latest
    container_name: knmp_remote_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_remote_data:/data
    networks:
      - knmp_remote_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knmp_remote_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8088}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8080
      DB_HOST: ${DB_HOST:-72.61.140.136}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-z04jP13DcE4z}
      DB_NAME: ${DB_NAME:-knmp_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-minimum-32-chars-long}
      STORAGE_DISK: ${STORAGE_DISK:-s3}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/app/storage/uploads}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
      S3_BUCKET: ${S3_BUCKET:-knmp-documents}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      - minio
    volumes:
      - backend_remote_storage:/app/storage/uploads
    networks:
      - knmp_remote_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knmp_remote_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
    networks:
      - knmp_remote_net

volumes:
  minio_remote_data:
  backend_remote_storage:

networks:
  knmp_remote_net:
    driver: bridge
