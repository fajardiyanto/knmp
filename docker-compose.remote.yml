services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knmp_remote_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8088}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8080
      DB_HOST: ${DB_HOST:-72.61.140.136}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-z04jP13DcE4z}
      DB_NAME: ${DB_NAME:-knmp_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-minimum-32-chars-long}
      STORAGE_DISK: ${STORAGE_DISK:-local}
      STORAGE_LOCAL_DIR: /app/storage/uploads
    volumes:
      - backend_remote_storage:/app/storage/uploads
    networks:
      - knmp_remote_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knmp_remote_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
    networks:
      - knmp_remote_net

volumes:
  backend_remote_storage:

networks:
  knmp_remote_net:
    driver: bridge
